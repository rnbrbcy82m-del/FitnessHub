<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080a0e"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Fitness Hub</title>
<style>
:root{--bg:#080a0e;--card:#141821;--muted:#8b94a5;--line:#252c38;--accent:#78f0b0;--text:#f5f7fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:18px 16px 100px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 22px}.logo{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:800}header h1{font-size:25px;margin:5px 0 0}
.panel{background:linear-gradient(145deg,#171d27,#12161e);border:1px solid #252d39;border-radius:20px;padding:17px;margin-bottom:13px}.label{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}.big{font-size:30px;font-weight:800;margin:7px 0}.small{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:#151a23;border:1px solid var(--line);border-radius:18px;padding:15px}.metric .value{font-size:24px;font-weight:800;margin:6px 0}.metric .unit{font-size:12px;color:var(--muted)}
h2{font-size:18px;margin:18px 2px 12px}.btn{background:var(--accent);color:#08110d;border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:15px;width:100%;margin-top:8px}.btn.secondary{background:#252d39;color:white}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{background:#25303d;border-radius:20px;padding:7px 10px;font-size:12px;color:var(--accent)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#10141b;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}.nav button{background:none;border:0;color:#98a2b3;font-size:11px;display:flex;flex-direction:column;gap:4px;align-items:center}.nav button.active{color:var(--accent)}.nav span{font-size:20px}
.exercise{border-top:1px solid var(--line);padding:12px 0}.exercise input{width:65px;background:#222a36;color:white;border:1px solid #384252;border-radius:8px;padding:8px;text-align:center}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calday{min-height:66px;background:#151a23;border:1px solid #242c37;border-radius:10px;padding:6px 3px;text-align:center;font-size:12px}.calday.train{border-color:var(--accent);background:#182a23}.calday.done{background:#1d3b2b;border-color:#5ed59c}.calday .num{font-weight:800}.calday .tag{font-size:9px;margin-top:4px;color:var(--accent)}
input{font-size:16px}.chart{height:100px;display:flex;align-items:end;gap:5px;margin-top:10px}.bar{flex:1;background:linear-gradient(#78f0b0,#348b65);border-radius:6px 6px 2px 2px;min-height:3px}.empty{padding:20px;text-align:center;color:var(--muted)}
.metric{cursor:pointer;transition:transform .15s}.metric:active{transform:scale(.98)}.metric-chart-panel{margin-top:12px}.history-svg{width:100%;height:auto;display:block}.history-grid{stroke:#394252;stroke-width:1}.history-line{fill:none;stroke:#78f0b0;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.history-dot{fill:#78f0b0}.history-label{fill:#8b94a5;font-size:11px}.metric-title{display:flex;justify-content:space-between;gap:8px}.metric-title span:last-child{color:#8b94a5;font-size:12px} </style></head><body><div id="app"></div>
<nav class="nav"><button onclick="go('home')" id="n-home"><span>▦</span>Dashboard</button><button onclick="go('calendar')" id="n-calendar"><span>▣</span>Kalender</button><button onclick="go('workout')" id="n-workout"><span>🏋️</span>Workout</button><button onclick="go('progress')" id="n-progress"><span>↗</span>Fortschritt</button><button onclick="go('routine')" id="n-routine"><span>◉</span>Routine</button></nav>
<script>
const P={"Monday":{name:"Upper A",exercises:[["Incline Dumbbell Press",3,"8–10"],["Chest Press",3,"8–12"],["Seated Cable Row",3,"10–12"],["Cable Curl",3,"10–12"],["Triceps Pushdown",3,"10–12"],["Face Pull",2,"12–15"]]},"Tuesday":{name:"Lower / Core",exercises:[["Leg Extension",3,"10–12"],["Seated Leg Curl",3,"10–12"],["Hip Thrust (pain-free)",3,"10–12"],["Hip Abduction",3,"12–15"],["Dead Bug",3,"8 / side"],["Bird Dog",2,"8 / side"]]},"Thursday":{name:"Upper B",exercises:[["Neutral Lat Pulldown",3,"8–12"],["Chest-Supported Row",3,"10–12"],["Pec Deck",3,"10–15"],["Lateral Raise",3,"12–15"],["Incline DB Curl",3,"10–12"],["Overhead Triceps Extension",3,"10–12"]]},"Saturday":{name:"Arms / Posture",exercises:[["Preacher Curl",3,"10–12"],["Hammer Curls",3,"10–12"],["Triceps Pushdown",3,"10–12"],["Triceps Machine",3,"10–12"],["Reverse Pec Deck",3,"12–15"],["Wall Angels",2,"10"],["Side Plank",2,"20–30 sec"],["Bird Dog",2,"8 / side"]]}};
const H=JSON.parse(localStorage.getItem("fitnessHubHealth")||"[]"); const weekdays=["So","Mo","Di","Mi","Do","Fr","Sa"];let A=load(),page="home",selectedDate=key(new Date()),month=new Date();
function load(){try{return JSON.parse(localStorage.getItem("fitnessHubData")||'{"workouts":[],"measurements":[]}')}catch(e){return {workouts:[],measurements:[]}}}
function save(){localStorage.setItem("fitnessHubData",JSON.stringify(A))}
function saveHealth(){localStorage.setItem("fitnessHubHealth",JSON.stringify(H))}
function normHealth(d){if(!d||!d.date)return null;let sl=d.sleep||{};return {date:d.date,steps:num(d.steps),active_energy_kcal:num(d.active_energy_kcal),distance_km:num(d.distance_km),resting_heart_rate:num(d.resting_heart_rate),hrv_ms:num(d.hrv_ms??d.hrv),sleep_minutes:num(d.sleep_duration_minutes??sl.duration_minutes),training_minutes:num(d.training_minutes),weight_kg:num(d.weight_kg),total_energy_kcal:num(d.total_energy_kcal)}}
function num(v){if(v===null||v===undefined||v==="<null>"||v==="")return null;let n=Number(v);return Number.isFinite(n)?n:null}
function importHealthFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let raw=JSON.parse(r.result),arr=Array.isArray(raw.days)?raw.days:(raw.date?[raw]:[]);if(!arr.length){alert("JSON erkannt, aber keine Tagesdaten gefunden (date oder days).") ;return;}let incoming=arr.map(normHealth).filter(Boolean);incoming.forEach(d=>{let i=H.findIndex(x=>x.date===d.date);if(i>=0)H[i]=d;else H.push(d)});H.sort((a,b)=>a.date.localeCompare(b.date));saveHealth();render();alert(incoming.length+" Tage importiert/aktualisiert.");}catch(err){alert("JSON konnte nicht gelesen werden: "+err.message)}};r.readAsText(f);e.target.value=""}
function healthImportUI(){return `<div class="panel"><h2>Apple Health Daten</h2><div class="small">JSON aus Scriptable importieren. Die Daten bleiben lokal in diesem Browser gespeichert.</div><input type="file" accept=".json,application/json" id="healthFile" style="display:none" onchange="importHealthFile(event)"><button class="btn secondary" onclick="document.getElementById('healthFile').click()">Health-JSON importieren</button><div class="small">${H.length?H.length+" Tage gespeichert · zuletzt: "+H[H.length-1].date:"Noch keine Health-Daten importiert"}</div></div>`}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayName(s){return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date(s+"T12:00:00").getDay()]}
function hp(d){return H.find(x=>x.date===d)||{}}
function wp(d){return P[dayName(d)]||null}function log(d){return A.workouts.find(x=>x.date===d)}
function vol(w){return(w?.sets||[]).reduce((s,x)=>s+(+x.weight||0)*(+x.reps||0),0)}
function fmt(n){return n==null?"—":Number(n).toLocaleString("de-DE",{maximumFractionDigits:1})}
function go(p){page=p;render()}
function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));document.getElementById("n-"+page)?.classList.add("active");document.getElementById("app").innerHTML=page==="home"?home():page==="calendar"?calendar():page==="workout"?workout():page==="progress"?progress():routine()}
function healthMetricDefs(){return [{k:"steps",label:"Schritte",unit:"Steps",div:1},{k:"active_energy_kcal",label:"Aktive Energie",unit:"kcal",div:1},{k:"distance_km",label:"Distanz",unit:"km",div:1},{k:"resting_heart_rate",label:"Ruhepuls",unit:"bpm",div:1},{k:"hrv_ms",label:"HRV",unit:"ms",div:1},{k:"sleep_minutes",label:"Schlaf",unit:"Stunden",div:60}]}
function metricTile(def,x){let val=x[def.k];return `<div class="metric" onclick="showHealthChart('${def.k}')"><div class="metric-title"><div class="label">${def.label}</div><span>↗ Verlauf</span></div><div class="value">${val==null?"—":fmt(val/def.div)}</div><div class="unit">${def.unit}</div></div>`}
function showHealthChart(k){let def=healthMetricDefs().find(d=>d.k===k);if(!def)return;let records=H.filter(d=>d[k]!=null).slice(-14);let panel=document.getElementById('healthChart');if(!panel)return;if(!records.length){panel.innerHTML='<div class="panel metric-chart-panel">Für '+def.label+' sind keine Werte vorhanden.</div>';return;}let W=340,HT=210,pad={l:36,r:12,t:18,b:34},vals=records.map(d=>d[k]/def.div),min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1}let pts=vals.map((v,i)=>{let x=pad.l+(records.length===1?0:i*(W-pad.l-pad.r)/(records.length-1)),y=pad.t+(max-v)*(HT-pad.t-pad.b)/(max-min);return [x,y]});let path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '),grid=[0,1,2,3].map(i=>{let y=pad.t+i*(HT-pad.t-pad.b)/3;return `<line class="history-grid" x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}"/>`}).join(''),dots=pts.map(p=>`<circle class="history-dot" cx="${p[0]}" cy="${p[1]}" r="4"/>`).join(''),labels=records.map((d,i)=>i===0||i===records.length-1||i===Math.floor(records.length/2)?`<text class="history-label" text-anchor="middle" x="${pts[i][0]}" y="${HT-8}">${d.date.slice(5)}</text>`:'').join('');panel.innerHTML=`<div class="panel metric-chart-panel"><div class="metric-title"><h2>${def.label} · letzte ${records.length} Messungen</h2><button class="btn secondary" style="width:auto;padding:8px 12px" onclick="document.getElementById('healthChart').innerHTML=''">Schließen</button></div><div class="small">${records[0].date} – ${records[records.length-1].date}</div><svg class="history-svg" viewBox="0 0 ${W} ${HT}" role="img">${grid}<path class="history-line" d="${path}"/>${dots}${labels}</svg><div class="small">${records.map(d=>`${d.date}: ${fmt(d[k]/def.div)} ${def.unit}`).reverse().join(' · ')}</div></div>`}
function home(){let today=key(new Date()),x=hp(today);if(!H.find(d=>d.date===today)&&H.length)x=H[H.length-1];let week=new Date();week.setDate(week.getDate()-((week.getDay()+6)%7));let dates=Array.from({length:7},(_,i)=>{let d=new Date(week);d.setDate(d.getDate()+i);return key(d)}),count=dates.filter(d=>log(d)).length,w=log(today);
return `<header><div><div class="logo">FITNESS HUB</div><h1>Dein Dashboard</h1></div><div class="pill">${count}/4 Woche</div></header>${healthImportUI()}<div class="panel"><div class="label">Heute · ${new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}</div><h2 style="margin:8px 0">${wp(today)?.name||"Recovery Day"}</h2><div class="small">${w?"Workout protokolliert ✓":wp(today)?"Heute ist Training geplant":"Erholung & Bewegung"}</div>${wp(today)?'<button class="btn" onclick="selectedDate=key(new Date());go(\'workout\')">Workout starten</button>':''}</div>
<div class="grid">${healthMetricDefs().map(d=>metricTile(d,x)).join("")}</div><div id="healthChart"></div><div class="small" style="margin:0 2px 14px">${x.date&&x.date!==today?"Health-Kacheln zeigen den letzten importierten Tag: "+x.date:""}</div><h2>Diese Woche</h2><div class="panel"><div class="row"><div><div class="label">Trainings</div><div class="big">${count}<span class="small"> / 4</span></div></div><div><div class="label">Volumen</div><div class="big">${fmt(dates.reduce((s,d)=>s+vol(log(d)),0))}</div><div class="small">kg × reps</div></div></div><div class="chart">${dates.map(d=>'<div class="bar" style="height:'+Math.max(3,log(d)?40:5)+'%"></div>').join("")}</div></div><h2>Zuletzt</h2>${A.workouts.slice(-3).reverse().map(w=>'<div class="panel"><b>'+w.name+'</b><div class="small">'+w.date+' · '+fmt(vol(w))+' Gesamtvolumen</div></div>').join("")||'<div class="empty">Noch keine Workouts</div>'}`}
function calendar(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),daysN=new Date(y,m+1,0).getDate(),cells=Array(first.getDay()).fill(null).concat(Array.from({length:daysN},(_,i)=>i+1));return `<header><div><div class="logo">FITNESS HUB</div><h1>Trainingskalender</h1></div></header><div class="panel"><div class="row"><button class="btn secondary" style="width:auto" onclick="shift(-1)">‹</button><b>${month.toLocaleDateString("de-DE",{month:"long",year:"numeric"})}</b><button class="btn secondary" style="width:auto" onclick="shift(1)">›</button></div><div class="calendar" style="margin-top:14px">${weekdays.map(x=>'<div class="small" style="text-align:center">'+x+'</div>').join("")}${cells.map(n=>{if(!n)return '<div></div>';let d=key(new Date(y,m,n)),p=wp(d),done=log(d);return '<div class="calday '+(p?'train ':'')+(done?'done':'')+'" onclick="pick(&quot;'+d+'&quot;)"><div class="num">'+n+'</div><div class="tag">'+(done?'✓':p?p.name.split(" ")[0]:'')+'</div></div>'}).join("")}</div></div><div class="panel"><div class="label">Ausgewählter Tag</div><h2>${selectedDate}</h2><b>${wp(selectedDate)?.name||"Ruhetag"}</b><div class="small">${log(selectedDate)?"Training abgeschlossen":wp(selectedDate)?"Geplant":"Kein Training geplant"}</div>${wp(selectedDate)?'<button class="btn" onclick="go(\'workout\')">Workout ansehen / loggen</button>':''}</div>`}
function shift(n){month.setMonth(month.getMonth()+n);render()}function pick(d){selectedDate=d;render()}
function workout(){let p=wp(selectedDate);if(!p)return '<header><h1>Workout</h1></header><div class="panel">Kein Training geplant. Wähle einen Trainingstag im Kalender.</div>';let ex=log(selectedDate)?.sets||[];return `<header><div><div class="logo">FITNESS HUB</div><h1>${p.name}</h1></div></header><div class="panel"><div class="label">${selectedDate}</div><div class="small">Gewicht und Wiederholungen pro Satz eingeben.</div></div>${p.exercises.map((e,i)=>{let prior=ex.filter(s=>s.exercise===e[0]);return '<div class="panel"><b>'+e[0]+'</b><div class="small">'+e[1]+' Sätze · '+e[2]+'</div>'+Array.from({length:e[1]},(_,j)=>{let s=prior[j]||{};return '<div class="exercise row"><span class="small">Satz '+(j+1)+'</span><input type="number" placeholder="kg" id="w-'+i+'-'+j+'" value="'+(s.weight??'')+'"><input type="number" placeholder="Reps" id="r-'+i+'-'+j+'" value="'+(s.reps??'')+'"></div>'}).join("")+'</div>'}).join("")}<button class="btn" onclick="saveWorkout()">Workout speichern ✓</button>`}
function saveWorkout(){let p=wp(selectedDate),sets=[];p.exercises.forEach((e,i)=>{for(let j=0;j<e[1];j++){let weight=document.getElementById("w-"+i+"-"+j).value,reps=document.getElementById("r-"+i+"-"+j).value;if(weight||reps)sets.push({exercise:e[0],weight:+(weight||0),reps:+(reps||0)})}});A.workouts=A.workouts.filter(x=>x.date!==selectedDate);A.workouts.push({date:selectedDate,name:p.name,sets});A.workouts.sort((a,b)=>a.date.localeCompare(b.date));save();render();alert("Workout gespeichert!")}
function progress(){let ws=A.workouts.slice().sort((a,b)=>a.date.localeCompare(b.date)),ms=A.measurements.slice().sort((a,b)=>a.date.localeCompare(b.date));return `<header><div><div class="logo">FITNESS HUB</div><h1>Fortschritt</h1></div></header><div class="grid"><div class="metric"><div class="label">Workouts</div><div class="value">${ws.length}</div></div><div class="metric"><div class="label">Volumen</div><div class="value">${fmt(ws.reduce((s,w)=>s+vol(w),0))}</div><div class="unit">kg × reps</div></div></div><h2>Körperwerte</h2><div class="panel"><label class="small">Gewicht (kg)</label><input id="weight" type="number" step=".1" placeholder="z. B. 80.5" style="width:100%;padding:12px;margin:8px 0;background:#222a36;color:white;border:1px solid #384252;border-radius:10px"><label class="small">Taillenumfang (cm)</label><input id="waist" type="number" step=".1" placeholder="z. B. 85" style="width:100%;padding:12px;margin:8px 0;background:#222a36;color:white;border:1px solid #384252;border-radius:10px"><button class="btn" onclick="addMeasurement()">Messung speichern</button></div><h2>Messhistorie</h2>${ms.slice(-8).reverse().map(m=>'<div class="panel"><b>'+m.date+'</b><div class="small">Gewicht: '+(m.weight==null?'—':m.weight+' kg')+' · Taille: '+(m.waist==null?'—':m.waist+' cm')+'</div></div>').join("")||'<div class="empty">Noch keine Messungen</div>'}<h2>Workout-Verlauf</h2>${ws.slice(-10).reverse().map(w=>'<div class="panel"><b>'+w.name+'</b><div class="small">'+w.date+' · '+w.sets.length+' Sätze · '+fmt(vol(w))+' Volumen</div></div>').join("")||'<div class="empty">Noch keine Workouts</div>'}`}
function addMeasurement(){let weight=document.getElementById("weight").value,waist=document.getElementById("waist").value;A.measurements.push({date:key(new Date()),weight:weight?+weight:null,waist:waist?+waist:null});save();render()}
function routine(){return `<header><div><div class="logo">FITNESS HUB</div><h1>Posture & Recovery</h1></div></header><div class="panel"><h2 style="margin-top:0">Tägliche Routine</h2>${["Doorway chest stretch · 30 sec","Wall slides · 10 reps","Thoracic foam roller extension · 60 sec","Pelvic tilt · 10 reps","Bewegungspause alle 30–60 Minuten"].map(x=>'<div class="exercise">'+x+'</div>').join("")}</div><div class="panel"><h2 style="margin-top:0">Trainingswoche</h2><div class="small">Montag · Upper A<br>Dienstag · Lower / Core<br>Mittwoch · Recovery<br>Donnerstag · Upper B<br>Freitag · Recovery<br>Samstag · Arms / Posture<br>Sonntag · Recovery</div></div><div class="panel"><div class="label">Hinweis</div><div class="small">Fuß- und Rückenbeschwerden berücksichtigen. Bewegungen bei Schmerz abbrechen; Hip Thrust nur schmerzfrei und mit stabiler Fußposition.</div></div>`}
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("service-worker.js").catch(()=>{});}
</script></body></html>
